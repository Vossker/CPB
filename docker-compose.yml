services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cpb
      POSTGRES_USER: cpb
      POSTGRES_PASSWORD: cpb-dev-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpb -d cpb"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${CPB_STORAGE_ACCESS_KEY:-cpb-minio}
      MINIO_ROOT_PASSWORD: ${CPB_STORAGE_SECRET_KEY:-development-only-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done &&
        mc mb --ignore-existing local/cpb
    environment:
      MINIO_ROOT_USER: ${CPB_STORAGE_ACCESS_KEY:-cpb-minio}
      MINIO_ROOT_PASSWORD: ${CPB_STORAGE_SECRET_KEY:-development-only-change-me}

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      CPB_DATABASE_URL: postgresql+psycopg://cpb:cpb-dev-only@postgres:5432/cpb
      CPB_STORAGE_ENDPOINT: http://minio:9000
      CPB_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn cpb.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
