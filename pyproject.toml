[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpb"
version = "0.1.0"
description = "A minimal distributed compute-task marketplace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
cpb = "cpb.cli:main"
cpb-worker = "cpb_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpb", "src/cpb_worker"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["postgres: requires a PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

